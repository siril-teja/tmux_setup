# ~/.tmux.conf -- mouse-first tmux for VS Code Remote SSH (tmux 3.8 from the tools conda env, 2026-10-21)
#
# Everything is reachable with the mouse:
#   [ ◆ session ▾ ]  status bar, left     click: sessions menu (switch / new / rename / detach / close)
#   window tabs      status bar, middle   click: switch window, right-click: window menu
#   [ ☰ menu ]       status bar, right    click: pane + window actions, help
#   right-click in a pane                 same menu as ☰, for the pane under the mouse
# Single keyboard fallback: Ctrl+B then o opens the ☰ menu.
# Every "Close"/"Kill" item asks y/n first and names what it stops.

# ---------------------------------------------------------------- basics
set -g  mouse on
set -g  history-limit 50000
set -sg escape-time 10
set -g  default-terminal "tmux-256color"
# panes start the same non-login bash as VS Code terminals (.bashrc only): skips /etc/profile, whose stale
# MSC Helium line prints "Licensing/Helium/msclic.ini: No such file or directory"; its settings are inherited anyway
set -g  default-command "${SHELL}"
set -as terminal-features ",xterm-256color:RGB:clipboard"   # VS Code terminal: true colour, OSC 52 copy
set -s  set-clipboard on
# every copy (drag, double/triple-click, copy mode) is also piped here, only to show the "✓ copied" chip;
# the clipboard copy itself is OSC 52 above. @copied_id keeps an older copy from hiding a newer chip early.
set -s  copy-command 't=$(cat); l=$(printf "%s\n" "$t" | wc -l); if [ "$l" -eq 1 ]; then m="1 line"; else m="$l lines"; fi;tmux set -g @copied "$m" \; set -g @copied_id $$; tmux list-clients | cut -d: -f1 | xargs -rn1 tmux refresh-client -S -t; sleep 1.5; [ "$(tmux show -gv @copied_id)" = "$$" ] && tmux set -gu @copied; tmux list-clients | cut -d: -f1 | xargs -rn1 tmux refresh-client -S -t'
set -g  renumber-windows on
set -g  detach-on-destroy off          # closing a session moves you to another one instead of dropping out
set -g  pane-scrollbars modal          # a draggable scrollbar appears while scrolled back, hidden otherwise
# every new session starts with three terminals: a full-height one on the left, two stacked on the right,
# all in the session's folder; the cursor starts in the left one
set-hook -g session-created 'split-window -h -c "#{pane_current_path}" ; split-window -v -c "#{pane_current_path}" ; select-pane -L'

# ---------------------------------------------------------------- look
set -g status-position bottom
set -g status-interval 15
# Claude palette: orange #d97757 = active / pressed, cream #f0eee6 text, warm greys #3d3d3a chips, #8a8880 quiet text.
# The bar itself uses the terminal's own background, so it sits in whatever VS Code theme is active.
# @pressed (sessions|menu) lights a button orange while it is pressed and briefly after (see the mouse bindings).
# @focus (sessions|w<index>|menu) is the keyboard focus of the bottom-bar mode (Ctrl+B Tab), shown cream.
set -g status-style "bg=default,fg=#8a8880"
set -g status-left-length 40
set -g status-left  "#{?#{==:#{@pressed},sessions},#[bg=#d97757#,fg=#141413],#{?#{==:#{@focus},sessions},#[bg=#f0eee6#,fg=#141413],#[bg=#3d3d3a#,fg=#f0eee6]}}#[bold] ◆ #S ▾ #[default] "
set -g window-status-format         "#{?#{==:#{@focus},w#{window_index}},#[bg=#f0eee6#,fg=#141413#,bold],#[fg=#8a8880]} #I #W "
set -g window-status-current-format "#{?#{==:#{@focus},w#{window_index}},#[bg=#f0eee6#,fg=#141413],#[bg=#d97757#,fg=#141413]}#[bold] #I #W#{?window_zoomed_flag, (zoomed),} "
set -g window-status-separator " "
set -g status-right-length 60
# the clock is Luxembourg time (the server clock is UTC); %% keeps tmux from expanding it in server time
# @copied shows a "✓ copied ..." chip for 1.5 s after each copy (set by copy-command below)
set -g status-right "#{?@copied,#[bg=#d97757#,fg=#141413#,bold] ✓ copied #{@copied} #[default] ,}#[range=user|menu]#{?#{==:#{@pressed},menu},#[bg=#d97757#,fg=#141413],#{?#{==:#{@focus},menu},#[bg=#f0eee6#,fg=#141413],#[bg=#3d3d3a#,fg=#f0eee6]}}#[bold] ☰ menu #[norange default] #[fg=#8a8880]#(TZ=Europe/Luxembourg date +%%H:%%M) "
# live readings (cpu, ram, gpu, marc, claude) in the middle of the bar: tmux's default layout plus one centred
# section running ~/.config/tmux/status_info.sh every status-interval
set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=centre]#(~/.config/tmux/status_info.sh)#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g pane-border-style        "fg=#3d3d3a"
set -g pane-active-border-style "fg=#d97757"
# a title line on top of every terminal, orange for the active one: with the dividers between terminals this
# frames the active one (tmux draws no line along the outer window edge, so a full 4-sided box is not possible)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#d97757] ● #{pane_index} #{pane_current_command} ,#[fg=#6b6a65] #{pane_index} #{pane_current_command} }"
set -g pane-border-lines single
set -g pane-scrollbars-style    "bg=#3d3d3a,fg=#d97757,width=1,pad=0"
set -g mode-style               "bg=#d97757,fg=#141413"          # text selection and list highlights
set -g message-style            "bg=#262624,fg=#f0eee6"          # prompts such as "Close terminal? (y/n)"
set -g message-command-style    "bg=#262624,fg=#d97757"
set -g menu-style          "bg=#262624,fg=#f0eee6"
set -g menu-selected-style "bg=#d97757,fg=#141413"
set -g menu-border-style   "fg=#d97757"
set -g menu-border-lines   rounded

# ---------------------------------------------------------------- menus (one definition each, used by mouse and key)
# position: at the mouse when opened by a click; from the keyboard, bottom right just above the ☰ button
set -s command-alias[100] 'main-menu=display-menu -O -M -T "#[align=centre] ☰ #{session_name} " -x "#{?popup_mouse_centre_x,#{popup_mouse_centre_x},#{client_width}}" -y "#{?popup_mouse_top,#{popup_mouse_top},#{e|-:#{popup_status_line_y},1}}" \
  "Split side by side"   "" "split-window -h -c \"#{pane_current_path}\"" \
  "Split top / bottom"   "" "split-window -v -c \"#{pane_current_path}\"" \
  "#{?window_zoomed_flag,Unzoom terminal,Zoom terminal (fill window)}" "" "resize-pane -Z" \
  "" \
  "New window"           "" "new-window -c \"#{pane_current_path}\"" \
  "Rename window..."     "" "command-prompt -I \"#W\" -p \"Window name:\" { rename-window -- \"%%\" }" \
  "Scroll / select text" "" "copy-mode" \
  "" \
  "Sessions..."          "" "session-menu" \
  "Help"                 "" "help-menu" \
  "" \
  "#{?#{&&:#{==:#{window_panes},1},#{==:#{session_windows},1}},Close terminal (ends the session)...,Close terminal...}" "" \
      "confirm-before -p \"Close this terminal? Stops #{pane_current_command} running in it. (y/n)\" kill-pane" \
  "Close window..."      "" "confirm-before -p \"Close window #W? Stops all #{window_panes} terminal(s) in it. (y/n)\" kill-window"'

set -s command-alias[101] 'window-menu=display-menu -O -M -t = -T "#[align=centre] window #I #W " -x W -y W \
  "Rename window..."     "" "command-prompt -I \"#W\" -p \"Window name:\" { rename-window -- \"%%\" }" \
  "New window"           "" "new-window" \
  "Move left"            "" "swap-window -d -t -1" \
  "Move right"           "" "swap-window -d -t +1" \
  "" \
  "Close window..."      "" "confirm-before -p \"Close window #W? Stops all #{window_panes} terminal(s) in it. (y/n)\" kill-window"'

# the session list changes, so this menu is built by a small script each time it opens
set -s command-alias[102] 'session-menu=run-shell "~/.config/tmux/session_menu.sh menu \"#{client_name}\""'

set -s command-alias[103] 'help-menu=display-menu -O -M -T "#[align=centre] tmux with the mouse " -x C -y C \
  "Click a terminal             make it active"                        "" "" \
  "Drag a terminal border       resize"                                "" "" \
  "Mouse wheel                  scroll back (wheel to the bottom ends it)" "" "" \
  "Drag over text               select + copy  (Shift+drag: VS Code)"  "" "" \
  "Middle-click                 paste what tmux copied"                "" "" \
  "Right-click a terminal, or ☰ split / zoom / windows / close"        "" "" \
  "Click ◆ session ▾            switch / new / rename / detach"        "" "" \
  "Click a tab                  switch window (right-click: actions)" "" "" \
  "" \
  "Ctrl+B then o                this menu from the keyboard"           "" "" \
  "Tab on an empty prompt       next terminal, then the bottom bar"    "" "" \
  "  in the bar                 Tab / arrows move, Enter or Up opens"  "" "" \
  "exit   or   Ctrl+B then d    detach (everything keeps running)"     "" "" \
  "tmux   /   tmux a            new session / reattach (plain shell)"  "" ""'

# ---------------------------------------------------------------- mouse bindings
# Menus open on the button *release*: a menu opened on the press is closed again by the release that follows.
# right-click in a pane: activate it, then the menu (programs that use the mouse themselves, e.g. htop, keep it)
bind -n MouseDown3Pane       if -F -t = "#{mouse_any_flag}" "send-keys -M" "select-pane -t ="
bind -n MouseUp3Pane         if -F -t = "#{mouse_any_flag}" "send-keys -M" "main-menu"
bind -n M-MouseDown3Pane     "select-pane -t ="
bind -n M-MouseUp3Pane       main-menu
# button feedback: the press lights the button (button-down NAME), the release opens its menu and the light
# goes out 0.4 s later (button-up), so even a quick click visibly flashes
set -s command-alias[104] 'button-down=set -g @pressed'
set -s command-alias[105] 'button-up=run-shell -b "sleep 0.4; tmux set -gu @pressed; tmux refresh-client -S -t \"#{client_name}\""'
# ◆ session ▾ button (the whole status-left), left or right click
bind -n MouseDown1StatusLeft   "button-down sessions ; refresh-client -S"
bind -n MouseDown3StatusLeft   "button-down sessions ; refresh-client -S"
bind -n M-MouseDown3StatusLeft "button-down sessions ; refresh-client -S"
bind -n MouseUp1StatusLeft     "session-menu ; button-up"
bind -n MouseUp3StatusLeft     "session-menu ; button-up"
bind -n M-MouseUp3StatusLeft   "session-menu ; button-up"
# ☰ menu button (a range inside status-right; the clock next to it does nothing); tabs switch on the press
bind -n MouseDown1Status       if -F "#{==:#{mouse_status_range},menu}" "button-down menu ; refresh-client -S" "select-window -t ="
bind -n MouseDown1StatusRight  if -F "#{==:#{mouse_status_range},menu}" "button-down menu ; refresh-client -S"
bind -n MouseUp1Status         if -F "#{==:#{mouse_status_range},menu}" "main-menu ; button-up" { if -F "#{@pressed}" button-up }
bind -n MouseUp1StatusRight    if -F "#{==:#{mouse_status_range},menu}" "main-menu ; button-up" { if -F "#{@pressed}" button-up }
# right-click a tab: switch to it, then its menu (tmux 3.8 draws no menu for a tab that is not the current one)
bind -n MouseDown3Status     "select-window -t = ; window-menu"
# the stock Alt+right-click tab menu kills without asking; use the confirming one
bind -n M-MouseDown3Status   "select-window -t = ; window-menu"

# ---------------------------------------------------------------- keyboard (prefix stays Ctrl+B)
bind o main-menu

# Keyboard walk, one loop: terminal 0 -> 1 -> 2 -> ◆ session -> window tabs -> ☰ menu -> terminal 0 ...
#   in a terminal: Tab on an EMPTY bash prompt (see the tmux section of ~/.bashrc), or Ctrl+B Tab
#   in the bar:    Tab / Right forward, Shift+Tab / Left back, Enter / Up / Down open, Esc back to the terminal
# The bar order is built from the live window list each time, so it follows windows being added or closed.
# (Ctrl+B Tab / Shift+Tab replace the stock floating pane.)
# (nested commands are quoted strings, not { } blocks: tmux does not expand an alias inside another alias's
#  { } block, but it does when a quoted command string is parsed at run time)
set -s command-alias[109] 'pane-tab-next=if -F "#{==:#{pane_index},#{e|-:#{window_panes},1}}" "set -g @focus sessions ; refresh-client -S ; switch-client -T bar" "select-pane -t :.+"'
set -s command-alias[110] 'pane-tab-prev=if -F "#{==:#{pane_index},0}" "set -g @focus menu ; refresh-client -S ; switch-client -T bar" "select-pane -t :.-"'
set -s command-alias[111] 'bar-next=if -F "#{==:#{@focus},menu}" "focus-off ; select-pane -t :.0" "focus-next"'
set -s command-alias[112] 'bar-prev=if -F "#{==:#{@focus},sessions}" "focus-off ; bar-to-last-pane" "focus-prev"'
set -s command-alias[113] 'bar-open=if -F "#{==:#{@focus},sessions}" "focus-off ; session-menu" "if -F \"#{==:#{@focus},menu}\" \"focus-off ; main-menu\" bar-open-window"'
set -s command-alias[114] 'bar-to-last-pane=run-shell "tmux select-pane -t :.#{e|-:#{window_panes},1}"'
set -s command-alias[115] 'bar-open-window=run-shell "tmux select-window -t :#{s/w//:@focus}" ; set -gu @focus ; refresh-client -S'
set -s command-alias[106] 'focus-next=run-shell "set -- sessions #{W:w#{window_index} }menu; f=#{@focus}; first=\$1; n=\$first; while [ \$# -gt 0 ]; do if [ \"\$1\" = \"\$f\" ]; then shift; n=\${1:-\$first}; break; fi; shift; done; tmux set -g @focus \$n" ; refresh-client -S ; switch-client -T bar'
set -s command-alias[107] 'focus-prev=run-shell "p=; n=; f=#{@focus}; for x in sessions #{W:w#{window_index} }menu; do [ \"\$x\" = \"\$f\" ] && n=\$p; p=\$x; done; tmux set -g @focus \${n:-\$p}" ; refresh-client -S ; switch-client -T bar'
set -s command-alias[108] 'focus-off=set -gu @focus ; refresh-client -S'
bind Tab  pane-tab-next
bind BTab pane-tab-prev
bind -T bar Tab    bar-next
bind -T bar Right  bar-next
bind -T bar BTab   bar-prev
bind -T bar Left   bar-prev
bind -T bar Enter  bar-open
bind -T bar Up     bar-open
bind -T bar Down   bar-open
bind -T bar Escape focus-off
bind -T bar Any    focus-off
# the stock < and > menus close things without asking; point them at the confirming menus
bind < window-menu
bind > main-menu
